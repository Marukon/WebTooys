<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>ShowOn - 全屏文本展示与滚动字幕工具</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined&display=swap">
    <script src="https://cdn.jsdmirror.com/npm/@material/web/all.js/+esm" type="module"></script>
    <link rel="stylesheet" href="index.css">
    <!-- SEO -->
    <script defer src="https://cloud.umami.is/script.js" data-website-id="8a96c320-b541-482f-acd4-6fc1b3ec22dc"></script>
    <meta name="description" content="ShowOn 是纯前端全屏文本展示工具，支持自定义文字、字体颜色、背景颜色及滚动/固定显示模式，适合提词与现场展示。">
    <meta name="keywords" content="全屏文字,滚动字幕,提词器,文本展示,电子告示牌">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://t.ftz.is-a.dev/proj/showon/index.html">
    <meta property="og:title" content="ShowOn - 全屏文本展示与滚动字幕工具">
    <meta property="og:description" content="ShowOn 是纯前端全屏文本展示工具，支持自定义文字、字体颜色、背景颜色及滚动/固定显示模式，适合提词与现场展示。">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="canonical" href="https://t.ftz.is-a.dev/proj/showon/index.html">
</head>
<body>
    <div>
        <div class="header">
            <h1 class="mdui-prose">ShowOn</h1>
            <md-icon-button onclick="document.querySelector('.dialog').setAttribute('open', '');">
                <md-icon>info</md-icon>
            </md-icon-button>
        </div>
        <div class="container">
            <div class="selections text">
                <span>文本：</span>
                <md-outlined-text-field type="textarea" label="输入文本" rows="1"></mdui-text-field>
            </div>
            <div class="selections">
                <span>字体颜色：</span>
                <input type="color" class="font-color" value="#202020">
                <span>背景颜色：</span>
                <input type="color" class="background-color" value="#fcfcff">
            </div>
            <div class="selections">
                <span>模式：</span>
                <form class="mode" value="full">
                    <md-radio name="mode" id="full"></md-radio>
                    <label for="full">全部显示</label>
                    <md-radio name="mode" id="scroll"></md-radio>
                    <label for="scroll">滚动显示</label>
                </form>
            </div>
            <md-filled-tonal-button class="start-btn">
                启动！
                <md-icon slot="icon">send</md-icon>
            </md-filled-tonal-button>
        </div>
    </div>

    <md-dialog class="dialog">
        <div slot="headline">关于</div>
        <div slot="content">
            这个其实没什么的，就是一个展示文本的工具，可以自定义字体颜色、背景颜色、显示模式等<br>
            其实可以自己探索的<br>
            这个东西用了material-web，好看吧<br>
            cdn用了zzko.cn的jsDelivr镜像，用了jsDeliver的esm.run，这个速度，斯……
        </div>
        <div slot="actions">
            <md-text-button onclick="document.querySelector('.dialog').removeAttribute('open');">关闭</md-text-button>
        </div>
    </md-dialog>

    <script src="index.js"></script>
</body>
</html>
