<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zen</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdmirror.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans&display=swap"> 
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC&display=swap">
    <link rel="stylesheet" href="index.css">
    <!-- SEO -->
    <script defer src="https://cloud.umami.is/script.js" data-website-id="8a96c320-b541-482f-acd4-6fc1b3ec22dc"></script>
    <meta name="description" content="Zen 是极简专注计时工具，提供干净的正计时器、实时时钟与可定制「一言」语录，帮你保持专注、记录心流时间。">
    <meta name="keywords" content="专注计时,正计时器,番茄钟,时间记录,一言">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://t.ftz.is-a.dev/proj/zen/index.html">
    <meta property="og:title" content="Zen - 简约专注正计时器与一言">
    <meta property="og:description" content="Zen 是极简专注计时工具，提供干净的正计时器、实时时钟与可定制「一言」语录，帮你保持专注、记录心流时间。">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="canonical" href="https://t.ftz.is-a.dev/proj/zen/index.html">
    <script type="module" async defer src="../../wtball.js"></script>
</head>
<body>
    <md-icon-button class="topbtn-l" href="data.html" target="_blank"><md-icon>show_chart</md-icon></md-icon-button>
    <md-icon-button class="topbtn-r"><md-icon>settings</md-icon></md-icon-button>

    <div class="main">
        <p class="sentence">点击加载一言</p>
        <h1 class="time">00:00:00</h1>

        <div class="btns">
            <md-elevated-button class="btn-l">
                <md-icon slot="icon">stop</md-icon>
                Stop
            </md-elevated-button>
            <md-elevated-button class="btn-r">
                <md-icon slot="icon">play_arrow</md-icon>
                Start
            </md-elevated-button>
        </div>

        <p class="clock">12:00:00</p>
    </div>

    <md-dialog>
        <div slot="headline">设置</div>
        <form slot="content" id="dialogform" method="dialog" style="line-height: 30px;">
            
            （目前仅支持自定义一言部分）<br>点击确定才能生效<br>
            <label>显示
                <md-switch id="isshowsent"></md-switch>
            </label><br>
            <label>自动刷新
                <md-switch id="isautosent"></md-switch>
            </label><br>
            <md-outlined-text-field id="reftimesent" type="number" label="刷新时间(s)" value="10" supporting-text="低于10s自动转化为10s">
            </md-outlined-text-field>
            
        </form>
        <div slot="actions">
            <md-text-button form="dialogform" value="ok" id="formbtn">确定</md-text-button>
        </div>
    </md-dialog>

    


    
    <script src="https://cdn.jsdmirror.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdn.jsdmirror.com/ajax/libs/moment.js/2.29.4/moment.min.js"></script>
    <script src="https://cdn.jsdmirror.com/npm/@material/web/all.js/+esm" type="module"></script>
    <script src="index.js"></script>
</body>
</html>
