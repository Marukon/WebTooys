<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown 在线表单工具 | 用 MD 快速生成收集表单</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdmirror.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC&display=swap">  
    <link rel="stylesheet" href="https://cdn.jsdmirror.com/npm/mdui/mdui.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <script src="https://cdn.jsdmirror.com/npm/mdui/mdui.global.js"></script>

    <script src="https://cdn.jsdmirror.com/ajax/libs/markdown-it/13.0.1/markdown-it.min.js"></script>
    <script src="https://cdn.jsdmirror.com/ajax/libs/jsSHA/3.3.1/sha.min.js"></script>
    <script src="https://cdn.jsdmirror.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

    <link rel="stylesheet" href="index.css">

    <!-- SEO -->
    <script defer src="https://cloud.umami.is/script.js" data-website-id="8a96c320-b541-482f-acd4-6fc1b3ec22dc"></script>
    <meta name="description" content="基于 Markdown 的在线表单工具：通过 Markdown 定义字段，自动渲染可填写表单，支持输入校验、本地自动保存与提交上传。">
    <meta name="keywords" content="在线表单,Markdown表单,表单生成器,数据收集">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://t.ftz.is-a.dev/proj/form">
    <meta property="og:title" content="Markdown 在线表单工具 | 用 MD 快速生成收集表单">
    <meta property="og:description" content="基于 Markdown 的在线表单工具：通过 Markdown 定义字段，自动渲染可填写表单，支持输入校验、本地自动保存与提交上传。">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="canonical" href="https://t.ftz.is-a.dev/proj/form">
    <script type="module" async defer src="../../wtball.js"></script>
</head>
<body>
    <mdui-dialog class="invalid-dialog">
        <span slot="headline">无效地址</span>
        <span slot="description">可能是因为：没加地址、格式错误、无法访问</span>
        <mdui-text-field variant="outlined" label="更改地址"></mdui-text-field>
        <mdui-button slot="action" variant="tonal">跳转</mdui-button>
    </mdui-dialog>
    <mdui-dialog class="upload-dialog">
        <span slot="headline">上传中</span>
        <mdui-circular-progress></mdui-circular-progress><p>请稍后</p>
    </mdui-dialog>
    <mdui-dialog class="autosave-dialog" close-on-overlay-click close-on-esc>
        <span slot="headline">自动保存提示</span>
        <span slot="description">检测到有一个自动保存的结果，是否使用</span>
        <mdui-button slot="action" variant="text" onclick="$('.autosave-dialog').removeAttr('open');">取消</mdui-button>
        <mdui-button slot="action" variant="tonal">使用</mdui-button>
    </mdui-dialog>

    <div class="mdui-prose main"></div>
    
    <script src="https://unpkg.com/@fingerprintjs/fingerprintjs@4.3.0/dist/fp.min.js"></script>
    <script src="index.js"></script>

</body>
</html>
